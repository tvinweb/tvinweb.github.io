  <meta name="description"
    content="WebTV is an open-source, browser-based IPTV client. Load your own legally authorized M3U/M3U8 playlists and watch live TV with a premium Smart TV interface." />
  <meta name="color-scheme" content="dark" />

    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- Favicon (inline SVG wordmark mark, no external asset needed) -->

    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0E14'/%3E%3Cpath d='M14 20h6l6 24 6-24h6l-9 32h-6z' fill='%23E8A33D'/%3E%3Ccircle cx='48' cy='18' r='4' fill='%23E8A33D'/%3E%3C/svg%3E" />
</head>

<body>
  <div id="root">
    <!-- Static boot screen shown before React mounts -->
    <div class="boot-screen" aria-hidden="true">
      <div class="boot-logo">
        <span class="boot-logo-mark">W</span>
        <span class="boot-logo-text">Web<em>TV</em></span>
      </div>
      <div class="boot-bar">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Safety net: if the app hasn't mounted (i.e. the boot screen is still
    // showing) after a few seconds, something failed to load — almost always
    // a missing internet connection, since React/Babel/hls.js load from CDNs.
    // Replace the blank/stuck boot screen with a clear message instead of
    // leaving the user staring at nothing.
    setTimeout(function () {
      var boot = document.querySelector(".boot-screen");
      if (boot && document.getElementById("root").contains(boot)) {
        boot.innerHTML =
          '<div class="boot-logo"><span class="boot-logo-mark">W</span>' +
          '<span class="boot-logo-text">Web<em>TV</em></span></div>' +
          '<p style="max-width:360px;text-align:center;color:#8b93a7;font-size:13.5px;line-height:1.6;margin:0;">' +
          "WebTV couldn't finish loading. This usually means there's no internet " +
          "connection (React, Babel, and hls.js load from CDNs) or a script was " +
          "blocked. Check your connection, then open the browser console (F12) " +
          "for the specific error, and reload the page." +
          "</p>";
      }
    }, 6000);
  </script>

  <!-- React 18 (CDN, pinned to a stable release) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone lets us author JSX directly, no build step required (pinned to a stable release) -->
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <!-- HLS.js for M3U8 / HLS playback in browsers without native support (pinned to a stable release) -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <!-- App source (JSX, transpiled in-browser by Babel) -->
  <script type="text/babel" data-presets="react">
    /* ==========================================================================
   WebTV — app.js
   A premium, open-source, browser-based IPTV client.
   React + ReactDOM are loaded from CDN as globals. This file is transpiled
   in-browser by Babel standalone (see index.html), so plain JSX + ES6+ works
   with no build step.

   WebTV does not ship, host, or link to any TV channels. Users must supply
   their own legally authorized M3U/M3U8 playlists.
   ========================================================================== */

    const { useState, useEffect, useRef, useMemo, useCallback, useReducer } = React;

    /* ============================== Storage ============================== */

    const LS_PREFIX = "webtv:";

    const storage = {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem(LS_PREFIX + key);
          if (raw === null) return fallback;
          return JSON.parse(raw);
        } catch (e) {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
          return true;
        } catch (e) {
          return false;
        }
      },
      remove(key) {
        try { localStorage.removeItem(LS_PREFIX + key); } catch (e) { }
      },
    };

    function useLocalStorage(key, initial) {
      const [value, setValue] = useState(() => storage.get(key, initial));
      useEffect(() => { storage.set(key, value); }, [key, value]);
      return [value, setValue];
    }

    /* ============================ Debounce hook ============================ */

    function useDebouncedValue(value, delay) {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const t = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(t);
      }, [value, delay]);
      return debounced;
    }

    /* ============================== M3U parser ============================== */

    /**
     * Parses M3U / M3U8 playlist text into a flat channel list.
     * Supports #EXTINF attributes: tvg-id, tvg-name, tvg-logo, group-title.
     */
    function parseM3U(text) {
      if (!text || typeof text !== "string") return [];
      const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const lines = normalized.split("\n").map((l) => l.trim()).filter((l) => l.length > 0);

      if (!lines.length || !/^#EXTM3U/i.test(lines[0])) {
        // Be lenient: some playlists omit the header. Only hard-fail if there is
        // no #EXTINF anywhere, which means this probably isn't an M3U at all.
        if (!lines.some((l) => l.startsWith("#EXTINF"))) {
          throw new Error("INVALID_M3U");
        }
      }

      const channels = [];
      let pending = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("#EXTINF")) {
          pending = parseExtinf(line);
        } else if (line.startsWith("#")) {
          // Other tags (#EXTGRP, #EXTVLCOPT, #EXTM3U, etc.) are currently ignored.
          continue;
        } else {
          // A bare URL line — attach it to the most recent #EXTINF, if any.
          const url = line;
          if (!/^https?:\/\//i.test(url)) continue;
          const meta = pending || {};
          channels.push({
            name: meta.name || guessNameFromUrl(url),
            logo: meta.logo || "",
            group: meta.group || "Uncategorized",
            tvgId: meta.tvgId || "",
            url,
          });
          pending = null;
        }
      }
      return channels;
    }

    function parseExtinf(line) {
      // Example:
      // #EXTINF:-1 tvg-id="bbc1" tvg-name="BBC One" tvg-logo="http://x/logo.png" group-title="News",BBC One HD
      const commaIdx = line.lastIndexOf(",");
      const attrPart = commaIdx >= 0 ? line.slice(0, commaIdx) : line;
      const namePart = commaIdx >= 0 ? line.slice(commaIdx + 1).trim() : "";

      const getAttr = (attr) => {
        const re = new RegExp(attr + '="([^"]*)"', "i");
        const m = attrPart.match(re);
        return m ? m[1] : "";
      };

      return {
        tvgId: getAttr("tvg-id"),
        logo: getAttr("tvg-logo"),
        group: getAttr("group-title"),
        name: namePart || getAttr("tvg-name"),
      };
    }

    function guessNameFromUrl(url) {
      try {
        const u = new URL(url);
        const parts = u.pathname.split("/").filter(Boolean);
        return decodeURIComponent(parts[parts.length - 1] || u.hostname);
      } catch (e) {
        return "Untitled Channel";
      }
    }

    /* ============================= XMLTV (EPG) parser ============================= */

    function parseXMLTV(text) {
      const doc = new DOMParser().parseFromString(text, "text/xml");
      if (doc.querySelector("parsererror")) throw new Error("INVALID_EPG");

      const programsByChannel = {};
      const progNodes = doc.getElementsByTagName("programme");
      for (let i = 0; i < progNodes.length; i++) {
        const node = progNodes[i];
        const channelId = node.getAttribute("channel");
        const start = parseXmltvTime(node.getAttribute("start"));
        const stop = parseXmltvTime(node.getAttribute("stop"));
        const titleNode = node.getElementsByTagName("title")[0];
        const descNode = node.getElementsByTagName("desc")[0];
        if (!channelId || !start) continue;
        if (!programsByChannel[channelId]) programsByChannel[channelId] = [];
        programsByChannel[channelId].push({
          start,
          stop: stop || start + 30 * 60 * 1000,
          title: titleNode ? titleNode.textContent : "Untitled Program",
          desc: descNode ? descNode.textContent : "",
        });
      }
      Object.values(programsByChannel).forEach((list) => list.sort((a, b) => a.start - b.start));
      return programsByChannel;
    }

    function parseXmltvTime(raw) {
      if (!raw) return null;
      // Format: 20240101120000 +0000
      const m = raw.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?/);
      if (!m) return null;
      const [, y, mo, d, h, mi, s, tz] = m;
      let iso = `${y}-${mo}-${d}T${h}:${mi}:${s}`;
      if (tz) iso += `${tz.slice(0, 3)}:${tz.slice(3)}`;
      else iso += "Z";
      const t = new Date(iso).getTime();
      return isNaN(t) ? null : t;
    }

    function findCurrentProgram(programs, now) {
      if (!programs || !programs.length) return null;
      return programs.find((p) => now >= p.start && now < p.stop) || null;
    }
    function findNextProgram(programs, now) {
      if (!programs || !programs.length) return null;
      return programs.find((p) => p.start > now) || null;
    }

    /* ================================ Icons ================================ */
    /* Small inline icon set so the app needs zero external image/icon assets. */

    const Icon = {
      Home: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      Grid: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8" /><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8" /><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8" /><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.8" /></svg>,
      Heart: (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill={p.filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.8" {...p}><path d="M12 20s-7.5-4.6-9.6-9.4C1 7.1 3 4 6.4 4c2 0 3.6 1.2 5.6 3.4C14 5.2 15.6 4 17.6 4 21 4 23 7.1 21.6 10.6 19.5 15.4 12 20 12 20Z" /></svg>,
      Clock: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><circle cx="12" cy="12" r="8.5" stroke="currentColor" strokeWidth="1.8" /><path d="M12 7.5V12l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg>,
      Search: (p) => <svg viewBox="0 0 24 24" width="17" height="17" fill="none" {...p}><circle cx="11" cy="11" r="6.5" stroke="currentColor" strokeWidth="1.8" /><path d="m20 20-3.5-3.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg>,
      Plus: (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></svg>,
      Settings: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><circle cx="12" cy="12" r="3.2" stroke="currentColor" strokeWidth="1.8" /><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1h-.2a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.5 7.5a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6v-.2a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 4.5a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1.1Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" /></svg>,
      List: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></svg>,
      Chevron: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="m9 6 6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      Play: (p) => <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" {...p}><path d="M8 5.5v13l11-6.5-11-6.5Z" /></svg>,
      Pause: (p) => <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" {...p}><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>,
      Next: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" {...p}><path d="M6 5v14l9-7L6 5Zm11 0h2v14h-2z" /></svg>,
      Prev: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" {...p}><path d="M18 5v14L9 12l9-7ZM7 5H5v14h2z" /></svg>,
      Volume: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="M16.5 9a4 4 0 0 1 0 6" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      Mute: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /><path d="m17 10 4 4m0-4-4 4" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>,
      Fullscreen: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      Pip: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><rect x="3" y="5" width="18" height="14" rx="1.5" stroke="currentColor" strokeWidth="1.7" /><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" /></svg>,
      Info: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><circle cx="12" cy="12" r="8.5" stroke="currentColor" strokeWidth="1.7" /><path d="M12 11v5.5M12 8v.01" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" /></svg>,
      X: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></svg>,
      Trash: (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      Refresh: (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" {...p}><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 4v4h-4M6 20v-4h4" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" /></svg>,
      Warn: (p) => <svg viewBox="0 0 24 24" width="30" height="30" fill="none" {...p}><path d="M12 3.5 22 20H2L12 3.5Z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" /><path d="M12 10v4.5M12 17.2v.01" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" /></svg>,
      Tv: (p) => <svg viewBox="0 0 24 24" width="18" height="18" fill="none" {...p}><rect x="3" y="5" width="18" height="12" rx="1.6" stroke="currentColor" strokeWidth="1.8" /><path d="M9 20h6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" /></svg>,
    };

    /* ============================== Small helpers ============================== */

    function classNames(...args) { return args.filter(Boolean).join(" "); }

    function timeLabel(ms) {
      const d = new Date(ms);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function friendlyError(kind) {
      const map = {
        INVALID_M3U: "That file doesn't look like a valid M3U playlist. Double-check the file and try again.",
        INVALID_EPG: "That XMLTV file couldn't be read. Double-check the file and try again.",
        FETCH_FAILED: "Couldn't load that URL. It may be offline, or the server may be blocking browser requests (CORS).",
        STREAM_ERROR: "Unable to play this channel. The stream may be offline or may not allow browser playback.",
        NETWORK: "Network error. Check your connection and try again.",
        EMPTY_PLAYLIST: "No channels were found in that playlist.",
      };
      return map[kind] || "Something went wrong. Please try again.";
    }

    let uidCounter = 0;
    function nextUid(prefix) { uidCounter += 1; return `${prefix}_${Date.now().toString(36)}_${uidCounter}`; }

    /* ============================== Toasts ============================== */

    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const push = useCallback((message, type = "info", ttl = 4200) => {
        const id = nextUid("toast");
        setToasts((t) => [...t, { id, message, type }]);
        setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), ttl);
      }, []);
      const remove = useCallback((id) => setToasts((t) => t.filter((x) => x.id !== id)), []);
      return { toasts, push, remove };
    }

    function ToastStack({ toasts, onDismiss }) {
      if (!toasts.length) return null;
      return (
        <div className="toast-stack" role="status" aria-live="polite">
          {toasts.map((t) => (
            <div key={t.id} className={classNames("toast", t.type)} onClick={() => onDismiss(t.id)}>
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    /* ============================== App ============================== */

    function App() {
      const { toasts, push: pushToast, remove: dismissToast } = useToasts();

      // Playlists: [{ id, name, sourceType, sourceValue, raw, addedAt }]
      const [playlists, setPlaylists] = useLocalStorage("playlists", []);
      const [favorites, setFavorites] = useLocalStorage("favorites", []); // array of channel uid
      const [recents, setRecents] = useLocalStorage("recents", []); // [{uid, at}]
      const [lastChannelUid, setLastChannelUid] = useLocalStorage("lastChannel", null);
      const [volume, setVolume] = useLocalStorage("volume", 0.8);
      const [muted, setMuted] = useLocalStorage("muted", false);
      const [uiPrefs, setUiPrefs] = useLocalStorage("uiPrefs", {
        sidebarExpanded: true,
        autoplay: true,
        rememberLast: true,
        reduceAnimations: false,
      });
      const [epgSource, setEpgSource] = useLocalStorage("epgSource", null); // { type: 'url', value }
      const [epgData, setEpgData] = useState({}); // channelId(tvgId) -> programs[]
      const [epgStatus, setEpgStatus] = useState("idle"); // idle | loading | ready | error

      const [activeView, setActiveView] = useState("home"); // home | favorites | recents | category:<name> | search
      const [searchTerm, setSearchTerm] = useState("");
      const debouncedSearch = useDebouncedValue(searchTerm, 220);

      const [showPlaylistManager, setShowPlaylistManager] = useState(playlists.length === 0);
      const [showSettings, setShowSettings] = useState(false);
      const [showEpgFor, setShowEpgFor] = useState(null); // channel object

      const [activeChannel, setActiveChannel] = useState(null); // channel object currently playing

      // Derive channels from all playlists (memoized: only recomputed when playlists change)
      const channels = useMemo(() => {
        const all = [];
        for (const pl of playlists) {
          let parsed = [];
          try {
            parsed = parseM3U(pl.raw);
          } catch (e) {
            continue; // Broken playlist text; PlaylistManager surfaces the original error on add/refresh.
          }
          parsed.forEach((ch, idx) => {
            all.push({ ...ch, uid: `${pl.id}::${idx}`, playlistId: pl.id, playlistName: pl.name });
          });
        }
        return all;
      }, [playlists]);

      const channelsById = useMemo(() => {
        const map = new Map();
        channels.forEach((c) => map.set(c.uid, c));
        return map;
      }, [channels]);

      // Categories, in first-seen order, with counts
      const categories = useMemo(() => {
        const order = [];
        const counts = {};
        for (const c of channels) {
          const g = c.group || "Uncategorized";
          if (!(g in counts)) order.push(g);
          counts[g] = (counts[g] || 0) + 1;
        }
        return order.map((name) => ({ name, count: counts[name] }));
      }, [channels]);

      // Restore last channel on first load (if enabled + still exists)
      useEffect(() => {
        if (uiPrefs.rememberLast && lastChannelUid && channelsById.has(lastChannelUid) && !activeChannel) {
          // Don't auto-open playback on load; just make it easy to resume. We keep this
          // passive so a fresh page load doesn't immediately grab audio/video permissions.
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [channelsById]);

      // Load EPG whenever the source changes
      useEffect(() => {
        let cancelled = false;
        if (!epgSource || !epgSource.value) { setEpgData({}); setEpgStatus("idle"); return; }
        setEpgStatus("loading");
        (async () => {
          try {
            let text;
            if (epgSource.type === "url") {
              const res = await fetch(epgSource.value);
              if (!res.ok) throw new Error("FETCH_FAILED");
              text = await res.text();
            } else {
              text = epgSource.value; // raw text (from an uploaded file)
            }
            const parsed = parseXMLTV(text);
            if (!cancelled) { setEpgData(parsed); setEpgStatus("ready"); }
          } catch (e) {
            if (!cancelled) {
              setEpgStatus("error");
              pushToast(friendlyError(e.message === "INVALID_EPG" ? "INVALID_EPG" : "FETCH_FAILED"), "error");
            }
          }
        })();
        return () => { cancelled = true; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [epgSource]);

      const isFavorite = useCallback((uid) => favorites.includes(uid), [favorites]);
      const toggleFavorite = useCallback((uid) => {
        setFavorites((f) => (f.includes(uid) ? f.filter((x) => x !== uid) : [...f, uid]));
      }, [setFavorites]);

      const recordRecent = useCallback((uid) => {
        setRecents((list) => {
          const filtered = list.filter((r) => r.uid !== uid);
          return [{ uid, at: Date.now() }, ...filtered].slice(0, 24);
        });
      }, [setRecents]);

      const playChannel = useCallback((channel) => {
        setActiveChannel(channel);
        setLastChannelUid(channel.uid);
        recordRecent(channel.uid);
      }, [recordRecent, setLastChannelUid]);

      const closePlayer = useCallback(() => setActiveChannel(null), []);

      // Sequential channel list used for next/prev inside the player: the current
      // view's filtered list if available, otherwise all channels.
      const filteredForView = useMemo(() => {
        const term = debouncedSearch.trim().toLowerCase();
        let list = channels;
        if (term) {
          list = channels.filter((c) => c.name.toLowerCase().includes(term) || (c.group || "").toLowerCase().includes(term));
        } else if (activeView === "favorites") {
          list = channels.filter((c) => favorites.includes(c.uid));
        } else if (activeView === "recents") {
          const order = new Map(recents.map((r, i) => [r.uid, i]));
          list = channels.filter((c) => order.has(c.uid)).sort((a, b) => order.get(a.uid) - order.get(b.uid));
        } else if (activeView.startsWith("category:")) {
          const cat = activeView.slice("category:".length);
          list = channels.filter((c) => (c.group || "Uncategorized") === cat);
        }
        return list;
      }, [channels, debouncedSearch, activeView, favorites, recents]);

      const goToRelativeChannel = useCallback((direction) => {
        if (!activeChannel) return;
        const list = filteredForView.length ? filteredForView : channels;
        const idx = list.findIndex((c) => c.uid === activeChannel.uid);
        if (idx === -1) return;
        const nextIdx = (idx + direction + list.length) % list.length;
        playChannel(list[nextIdx]);
      }, [activeChannel, filteredForView, channels, playChannel]);

      /* ---------- Playlist management actions ---------- */

      const addPlaylistFromText = useCallback((name, sourceType, sourceValue, raw) => {
        let parsed;
        try {
          parsed = parseM3U(raw);
        } catch (e) {
          pushToast(friendlyError("INVALID_M3U"), "error");
          return false;
        }
        if (!parsed.length) {
          pushToast(friendlyError("EMPTY_PLAYLIST"), "error");
          return false;
        }
        const entry = {
          id: nextUid("pl"),
          name: name || `Playlist ${playlists.length + 1}`,
          sourceType,
          sourceValue,
          raw,
          addedAt: Date.now(),
          channelCount: parsed.length,
        };
        setPlaylists((list) => [...list, entry]);
        pushToast(`Added "${entry.name}" — ${parsed.length} channels`, "success");
        return true;
      }, [playlists.length, setPlaylists, pushToast]);

      const addPlaylistFromUrl = useCallback(async (name, url) => {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("FETCH_FAILED");
          const text = await res.text();
          return addPlaylistFromText(name || url, "url", url, text);
        } catch (e) {
          pushToast(friendlyError("FETCH_FAILED"), "error");
          return false;
        }
      }, [addPlaylistFromText, pushToast]);

      const addDirectStream = useCallback((name, url) => {
        const raw = `#EXTM3U\n#EXTINF:-1 group-title="Direct Streams",${name || "Direct Stream"}\n${url}`;
        return addPlaylistFromText(name ? `${name} (direct)` : "Direct stream", "direct", url, raw);
      }, [addPlaylistFromText]);

      const refreshPlaylist = useCallback(async (id) => {
        const pl = playlists.find((p) => p.id === id);
        if (!pl) return;
        if (pl.sourceType === "file") {
          pushToast("This playlist was added from a local file — re-upload it to refresh.", "info");
          return;
        }
        try {
          const res = await fetch(pl.sourceValue);
          if (!res.ok) throw new Error("FETCH_FAILED");
          const text = await res.text();
          const parsed = parseM3U(text);
          setPlaylists((list) => list.map((p) => (p.id === id ? { ...p, raw: text, channelCount: parsed.length } : p)));
          pushToast(`Refreshed "${pl.name}" — ${parsed.length} channels`, "success");
        } catch (e) {
          pushToast(friendlyError("FETCH_FAILED"), "error");
        }
      }, [playlists, setPlaylists, pushToast]);

      const removePlaylist = useCallback((id) => {
        setPlaylists((list) => list.filter((p) => p.id !== id));
        pushToast("Playlist removed", "info");
      }, [setPlaylists, pushToast]);

      /* ---------- Keyboard shortcuts (global) ---------- */
      useEffect(() => {
        function onKeyDown(e) {
          const tag = (e.target && e.target.tagName) || "";
          const typing = tag === "INPUT" || tag === "TEXTAREA";
          if (activeChannel) {
            if (typing) return;
            if (e.key === "Escape") { closePlayer(); }
            else if (e.key === "ArrowLeft") { goToRelativeChannel(-1); }
            else if (e.key === "ArrowRight") { goToRelativeChannel(1); }
            // Space / M / F are handled inside VideoPlayer so they can reach the <video> element directly.
          } else if (e.key === "Escape") {
            if (showSettings) setShowSettings(false);
            else if (showPlaylistManager && playlists.length) setShowPlaylistManager(false);
            else if (showEpgFor) setShowEpgFor(null);
          }
        }
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [activeChannel, closePlayer, goToRelativeChannel, showSettings, showPlaylistManager, showEpgFor, playlists.length]);

      const sidebarExpanded = uiPrefs.sidebarExpanded;
      const setSidebarExpanded = (v) => setUiPrefs((p) => ({ ...p, sidebarExpanded: v }));

      return (
        <div className={classNames("app-shell", sidebarExpanded && "sidebar-expanded")}>
          <a href="#main-content" className="skip-link">Skip to content</a>

          <Sidebar
            expanded={sidebarExpanded}
            onToggleExpanded={() => setSidebarExpanded(!sidebarExpanded)}
            activeView={activeView}
            onNavigate={(v) => { setActiveView(v); setSearchTerm(""); }}
            categories={categories}
            favoritesCount={favorites.length}
            recentsCount={recents.length}
            onOpenSettings={() => setShowSettings(true)}
          />

          <Header
            title={headerTitle(activeView, categories)}
            searchTerm={searchTerm}
            onSearchChange={setSearchTerm}
            onOpenPlaylistManager={() => setShowPlaylistManager(true)}
            onOpenSettings={() => setShowSettings(true)}
          />

          <main className="app-main" id="main-content">
            {channels.length === 0 ? (
              <EmptyLibrary onAdd={() => setShowPlaylistManager(true)} />
            ) : debouncedSearch.trim() ? (
              <SearchResults
                term={debouncedSearch}
                channels={filteredForView}
                favorites={favorites}
                onToggleFavorite={toggleFavorite}
                onPlay={playChannel}
                epgData={epgData}
              />
            ) : activeView === "home" ? (
              <HomeView
                categories={categories}
                channels={channels}
                favorites={favorites}
                recents={recents}
                channelsById={channelsById}
                onToggleFavorite={toggleFavorite}
                onPlay={playChannel}
                onSeeCategory={(name) => setActiveView(`category:${name}`)}
                epgData={epgData}
              />
            ) : activeView === "favorites" ? (
              <CategoryGrid
                title="Favorites"
                channels={channels.filter((c) => favorites.includes(c.uid))}
                favorites={favorites}
                onToggleFavorite={toggleFavorite}
                onPlay={playChannel}
                emptyHint="Tap the heart on any channel to save it here."
                epgData={epgData}
              />
            ) : activeView === "recents" ? (
              <CategoryGrid
                title="Recently Watched"
                channels={recents.map((r) => channelsById.get(r.uid)).filter(Boolean)}
                favorites={favorites}
                onToggleFavorite={toggleFavorite}
                onPlay={playChannel}
                emptyHint="Channels you watch will show up here."
                epgData={epgData}
              />
            ) : activeView.startsWith("category:") ? (
              <CategoryGrid
                title={activeView.slice("category:".length)}
                channels={filteredForView}
                favorites={favorites}
                onToggleFavorite={toggleFavorite}
                onPlay={playChannel}
                epgData={epgData}
              />
            ) : null}
          </main>

          {activeChannel && (
            <VideoPlayer
              channel={activeChannel}
              onClose={closePlayer}
              onNext={() => goToRelativeChannel(1)}
              onPrev={() => goToRelativeChannel(-1)}
              isFavorite={isFavorite(activeChannel.uid)}
              onToggleFavorite={() => toggleFavorite(activeChannel.uid)}
              volume={volume}
              setVolume={setVolume}
              muted={muted}
              setMuted={setMuted}
              autoplay={uiPrefs.autoplay}
              epgProgram={currentProgramFor(activeChannel, epgData)}
              onOpenEpg={() => setShowEpgFor(activeChannel)}
              onError={(kind) => pushToast(friendlyError(kind), "error")}
            />
          )}

          {showPlaylistManager && (
            <PlaylistManager
              playlists={playlists}
              onClose={() => setShowPlaylistManager(false)}
              onAddFile={(name, raw) => addPlaylistFromText(name, "file", null, raw)}
              onAddUrl={addPlaylistFromUrl}
              onAddDirect={addDirectStream}
              onRefresh={refreshPlaylist}
              onRemove={removePlaylist}
            />
          )}

          {showSettings && (
            <Settings
              uiPrefs={uiPrefs}
              setUiPrefs={setUiPrefs}
              epgSource={epgSource}
              setEpgSource={setEpgSource}
              epgStatus={epgStatus}
              onClose={() => setShowSettings(false)}
              onClearData={() => {
                [
                  "playlists", "favorites", "recents", "lastChannel", "volume",
                  "muted", "uiPrefs", "epgSource",
                ].forEach((k) => storage.remove(k));
                window.location.reload();
              }}
            />
          )}

          {showEpgFor && (
            <EPG
              channel={showEpgFor}
              programs={epgData[showEpgFor.tvgId] || []}
              onClose={() => setShowEpgFor(null)}
            />
          )}

          <ToastStack toasts={toasts} onDismiss={dismissToast} />
        </div>
      );
    }

    function headerTitle(activeView, categories) {
      if (activeView === "home") return "Home";
      if (activeView === "favorites") return "Favorites";
      if (activeView === "recents") return "Recently Watched";
      if (activeView.startsWith("category:")) return activeView.slice("category:".length);
      return "WebTV";
    }

    function currentProgramFor(channel, epgData) {
      if (!channel || !channel.tvgId) return null;
      const programs = epgData[channel.tvgId];
      if (!programs) return null;
      return findCurrentProgram(programs, Date.now());
    }

    /* ============================== Sidebar ============================== */

    function Sidebar({ expanded, onToggleExpanded, activeView, onNavigate, categories, favoritesCount, recentsCount, onOpenSettings }) {
      return (
        <aside className="sidebar" aria-label="Primary">
          <div className="sidebar-brand">
            <div className="sidebar-brand-mark">W</div>
            <div className="sidebar-brand-text">Web<em>TV</em></div>
          </div>

          <nav className="sidebar-nav">
            <button className={classNames("sidebar-item", activeView === "home" && "active")} onClick={() => onNavigate("home")}>
              <span className="icon"><Icon.Home /></span>
              <span className="sidebar-item-label">Home</span>
            </button>
            <button className={classNames("sidebar-item", activeView === "favorites" && "active")} onClick={() => onNavigate("favorites")}>
              <span className="icon"><Icon.Heart /></span>
              <span className="sidebar-item-label">Favorites</span>
              {favoritesCount > 0 && <span className="count">{favoritesCount}</span>}
            </button>
            <button className={classNames("sidebar-item", activeView === "recents" && "active")} onClick={() => onNavigate("recents")}>
              <span className="icon"><Icon.Clock /></span>
              <span className="sidebar-item-label">Recently Watched</span>
              {recentsCount > 0 && <span className="count">{recentsCount}</span>}
            </button>

            {categories.length > 0 && (
              <>
                <div style={{ height: 14 }} />
                {categories.map((c) => (
                  <button
                    key={c.name}
                    className={classNames("sidebar-item", activeView === `category:${c.name}` && "active")}
                    onClick={() => onNavigate(`category:${c.name}`)}
                    title={c.name}
                  >
                    <span className="icon"><Icon.Tv /></span>
                    <span className="sidebar-item-label">{c.name}</span>
                    <span className="count">{c.count}</span>
                  </button>
                ))}
              </>
            )}
          </nav>

          <div className="sidebar-footer">
            <button className="sidebar-item" onClick={onOpenSettings}>
              <span className="icon"><Icon.Settings /></span>
              <span className="sidebar-item-label">Settings</span>
            </button>
            <button className="sidebar-toggle" onClick={onToggleExpanded} aria-label={expanded ? "Collapse sidebar" : "Expand sidebar"}>
              <span className="icon"><Icon.Chevron style={{ transform: expanded ? "rotate(180deg)" : "none" }} /></span>
              <span className="sidebar-item-label">Collapse</span>
            </button>
          </div>
        </aside>
      );
    }

    /* ============================== Header ============================== */

    function Header({ title, searchTerm, onSearchChange, onOpenPlaylistManager, onOpenSettings }) {
      return (
        <header className="app-header">
          <div className="header-title">{title}</div>

          <div className="search-box">
            <Icon.Search />
            <input
              type="search"
              value={searchTerm}
              onChange={(e) => onSearchChange(e.target.value)}
              placeholder="Search channels or categories…"
              aria-label="Search channels"
            />
          </div>

          <div className="header-actions">
            <button className="btn btn-accent" onClick={onOpenPlaylistManager}>
              <Icon.Plus /> Add Playlist
            </button>
            <button className="btn-icon" onClick={onOpenSettings} aria-label="Settings">
              <Icon.Settings />
            </button>
          </div>
        </header>
      );
    }

    /* ============================== Empty library ============================== */

    function EmptyLibrary({ onAdd }) {
      return (
        <div className="empty-state">
          <div style={{ fontSize: 40 }}><Icon.Tv width={40} height={40} /></div>
          <h2>No playlist yet</h2>
          <p>Add your own legally authorized M3U playlist, M3U URL, or direct M3U8 stream to start watching. WebTV never ships or links to any channels itself.</p>
          <button className="btn btn-accent" onClick={onAdd}><Icon.Plus /> Add Your First Playlist</button>
        </div>
      );
    }

    /* ============================== Home view (rails) ============================== */

    function HomeView({ categories, channels, favorites, recents, channelsById, onToggleFavorite, onPlay, onSeeCategory, epgData }) {
      const favChannels = channels.filter((c) => favorites.includes(c.uid)).slice(0, 20);
      const recentChannels = recents.map((r) => channelsById.get(r.uid)).filter(Boolean).slice(0, 20);

      return (
        <div>
          {recentChannels.length > 0 && (
            <Rail title="Continue Watching" channels={recentChannels} favorites={favorites} onToggleFavorite={onToggleFavorite} onPlay={onPlay} epgData={epgData} />
          )}
          {favChannels.length > 0 && (
            <Rail title="Favorites" channels={favChannels} favorites={favorites} onToggleFavorite={onToggleFavorite} onPlay={onPlay} onSeeAll={() => onSeeCategory && null} epgData={epgData} />
          )}
          {categories.map((cat) => (
            <Rail
              key={cat.name}
              title={cat.name}
              count={cat.count}
              channels={channels.filter((c) => (c.group || "Uncategorized") === cat.name).slice(0, 20)}
              favorites={favorites}
              onToggleFavorite={onToggleFavorite}
              onPlay={onPlay}
              onSeeAll={() => onSeeCategory(cat.name)}
              epgData={epgData}
            />
          ))}
        </div>
      );
    }

    function Rail({ title, count, channels, favorites, onToggleFavorite, onPlay, onSeeAll, epgData }) {
      const scrollRef = useRef(null);
      if (!channels.length) return null;
      return (
        <section className="rail">
          <div className="rail-head">
            <h2 className="rail-title">{title}</h2>
            {typeof count === "number" && <span className="rail-count">{count} channels</span>}
            {onSeeAll && <button className="btn btn-ghost" style={{ marginLeft: "auto", padding: "4px 10px" }} onClick={onSeeAll}>See all</button>}
          </div>
          <div className="rail-scroll" ref={scrollRef} role="list">
            {channels.map((c) => (
              <ChannelCard
                key={c.uid}
                channel={c}
                isFavorite={favorites.includes(c.uid)}
                onToggleFavorite={() => onToggleFavorite(c.uid)}
                onPlay={() => onPlay(c)}
                epgData={epgData}
              />
            ))}
          </div>
        </section>
      );
    }

    /* ============================== Category grid / Search results ============================== */

    const PAGE_SIZE = 48;

    function CategoryGrid({ title, channels, favorites, onToggleFavorite, onPlay, emptyHint, epgData }) {
      const [visible, setVisible] = useState(PAGE_SIZE);
      useEffect(() => { setVisible(PAGE_SIZE); }, [title, channels.length]);

      if (!channels.length) {
        return (
          <div className="empty-state">
            <h2>{title}</h2>
            <p>{emptyHint || "No channels found."}</p>
          </div>
        );
      }

      const shown = channels.slice(0, visible);

      return (
        <section>
          <div className="rail-head">
            <h2 className="rail-title">{title}</h2>
            <span className="rail-count">{channels.length} channels</span>
          </div>
          <div className="channel-grid" role="list">
            {shown.map((c) => (
              <ChannelCard
                key={c.uid}
                channel={c}
                isFavorite={favorites.includes(c.uid)}
                onToggleFavorite={() => onToggleFavorite(c.uid)}
                onPlay={() => onPlay(c)}
                epgData={epgData}
              />
            ))}
          </div>
          {visible < channels.length && (
            <div className="load-more-wrap">
              <button className="btn" onClick={() => setVisible((v) => v + PAGE_SIZE)}>
                Load more ({channels.length - visible} remaining)
              </button>
            </div>
          )}
        </section>
      );
    }

    function SearchResults({ term, channels, favorites, onToggleFavorite, onPlay, epgData }) {
      return (
        <CategoryGrid
          title={`Results for "${term}"`}
          channels={channels}
          favorites={favorites}
          onToggleFavorite={onToggleFavorite}
          onPlay={onPlay}
          emptyHint="Try a different channel name or category."
          epgData={epgData}
        />
      );
    }

    /* ============================== Channel card ============================== */

    function ChannelCard({ channel, isFavorite, onToggleFavorite, onPlay, epgData }) {
      const [imgFailed, setImgFailed] = useState(false);
      const program = channel.tvgId ? findCurrentProgram(epgData[channel.tvgId], Date.now()) : null;

      function onKeyDown(e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPlay(); }
      }

      return (
        <div className="channel-card" role="listitem" tabIndex={0} onClick={onPlay} onKeyDown={onKeyDown} aria-label={`Play ${channel.name}`}>
          <div className="channel-thumb">
            {channel.logo && !imgFailed ? (
              <img src={channel.logo} alt="" onError={() => setImgFailed(true)} loading="lazy" />
            ) : (
              <span className="fallback-initial">{(channel.name || "?").slice(0, 1).toUpperCase()}</span>
            )}
            <span className="channel-live-badge"><span className="dot" />LIVE</span>
            <button
              className={classNames("channel-fav-btn", isFavorite && "is-fav")}
              onClick={(e) => { e.stopPropagation(); onToggleFavorite(); }}
              aria-label={isFavorite ? `Remove ${channel.name} from favorites` : `Add ${channel.name} to favorites`}
              aria-pressed={isFavorite}
            >
              <Icon.Heart filled={isFavorite} />
            </button>
          </div>
          <div className="channel-meta">
            <p className="channel-name" title={channel.name}>{channel.name}</p>
            <p className="channel-group">{channel.group || "Uncategorized"}</p>
            {program && <p className="channel-epg-now">Now: {program.title}</p>}
          </div>
        </div>
      );
    }

    /* ============================== Video Player ============================== */

    function VideoPlayer({
      channel, onClose, onNext, onPrev, isFavorite, onToggleFavorite,
      volume, setVolume, muted, setMuted, autoplay, epgProgram, onOpenEpg, onError,
    }) {
      const videoRef = useRef(null);
      const hlsRef = useRef(null);
      const containerRef = useRef(null);

      const [playing, setPlaying] = useState(true);
      const [status, setStatus] = useState("loading"); // loading | playing | buffering | error
      const [errorInfo, setErrorInfo] = useState(null);
      const [qualities, setQualities] = useState([]); // [{ index, height, bitrate }]
      const [activeQuality, setActiveQuality] = useState(-1); // -1 = auto
      const [showQualityMenu, setShowQualityMenu] = useState(false);
      const [idle, setIdle] = useState(false);
      const idleTimerRef = useRef(null);
      const [retryTick, setRetryTick] = useState(0);

      const isHlsSource = /\.m3u8($|\?)/i.test(channel.url);

      /* --- Attach source (native HLS vs hls.js vs plain <video> src) --- */
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        setStatus("loading");
        setErrorInfo(null);
        setQualities([]);
        setActiveQuality(-1);

        let hls = null;
        const canPlayNativeHls = video.canPlayType("application/vnd.apple.mpegurl");

        function handleFatalError(kind) {
          setStatus("error");
          setErrorInfo(kind);
          onError && onError(kind);
        }

        if (isHlsSource && window.Hls && window.Hls.isSupported() && !canPlayNativeHls) {
          hls = new window.Hls({ enableWorker: true, lowLatencyMode: true });
          hlsRef.current = hls;
          hls.loadSource(channel.url);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, (_evt, data) => {
            const levels = (data.levels || []).map((lvl, i) => ({ index: i, height: lvl.height, bitrate: lvl.bitrate }));
            setQualities(levels);
            if (autoplay) video.play().catch(() => { });
          });
          hls.on(window.Hls.Events.ERROR, (_evt, data) => {
            if (data.fatal) {
              switch (data.type) {
                case window.Hls.ErrorTypes.NETWORK_ERROR:
                  handleFatalError("NETWORK");
                  break;
                case window.Hls.ErrorTypes.MEDIA_ERROR:
                  try { hls.recoverMediaError(); } catch (e) { handleFatalError("STREAM_ERROR"); }
                  break;
                default:
                  handleFatalError("STREAM_ERROR");
              }
            }
          });
        } else {
          // Native playback: either the browser supports HLS natively (Safari), or
          // this is a non-HLS direct stream URL.
          video.src = channel.url;
          const onLoaded = () => { if (autoplay) video.play().catch(() => { }); };
          const onErr = () => handleFatalError("STREAM_ERROR");
          video.addEventListener("loadedmetadata", onLoaded);
          video.addEventListener("error", onErr);
          video._cleanupNative = () => {
            video.removeEventListener("loadedmetadata", onLoaded);
            video.removeEventListener("error", onErr);
          };
        }

        return () => {
          if (hls) { hls.destroy(); hlsRef.current = null; }
          if (video) {
            if (video._cleanupNative) video._cleanupNative();
            video.removeAttribute("src");
            video.load();
          }
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [channel.url, retryTick]);

      /* --- Video element event wiring --- */
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        const onPlaying = () => { setStatus("playing"); setPlaying(true); };
        const onWaiting = () => setStatus((s) => (s === "error" ? s : "buffering"));
        const onPause = () => setPlaying(false);
        const onPlay = () => setPlaying(true);
        video.addEventListener("playing", onPlaying);
        video.addEventListener("waiting", onWaiting);
        video.addEventListener("pause", onPause);
        video.addEventListener("play", onPlay);
        return () => {
          video.removeEventListener("playing", onPlaying);
          video.removeEventListener("waiting", onWaiting);
          video.removeEventListener("pause", onPause);
          video.removeEventListener("play", onPlay);
        };
      }, []);

      /* --- Volume / mute sync --- */
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        video.volume = volume;
        video.muted = muted;
      }, [volume, muted]);

      /* --- Idle / overlay auto-hide --- */
      const wakeOverlay = useCallback(() => {
        setIdle(false);
        if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
        idleTimerRef.current = setTimeout(() => setIdle(true), 3800);
      }, []);
      useEffect(() => {
        wakeOverlay();
        return () => { if (idleTimerRef.current) clearTimeout(idleTimerRef.current); };
      }, [wakeOverlay, channel.uid]);

      /* --- Keyboard controls scoped to the player --- */
      useEffect(() => {
        function onKeyDown(e) {
          const tag = (e.target && e.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA") return;
          wakeOverlay();
          if (e.key === " ") { e.preventDefault(); togglePlay(); }
          else if (e.key.toLowerCase() === "m") { setMuted(!muted); }
          else if (e.key.toLowerCase() === "f") { toggleFullscreen(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); setVolume((v) => Math.min(1, +(v + 0.05).toFixed(2))); }
          else if (e.key === "ArrowDown") { e.preventDefault(); setVolume((v) => Math.max(0, +(v - 0.05).toFixed(2))); }
        }
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [muted, wakeOverlay]);

      function togglePlay() {
        const video = videoRef.current;
        if (!video) return;
        if (video.paused) video.play().catch(() => { });
        else video.pause();
      }

      function toggleFullscreen() {
        const el = containerRef.current;
        if (!document.fullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || (() => { })).call(document);
        }
      }

      function togglePip() {
        const video = videoRef.current;
        if (!video) return;
        if (document.pictureInPictureElement) {
          document.exitPictureInPicture().catch(() => { });
        } else if (video.requestPictureInPicture) {
          video.requestPictureInPicture().catch(() => { });
        }
      }

      function selectQuality(index) {
        setActiveQuality(index);
        setShowQualityMenu(false);
        if (hlsRef.current) hlsRef.current.currentLevel = index; // -1 restores ABR
      }

      function retry() {
        setRetryTick((t) => t + 1);
      }

      const progressPct = useMemo(() => {
        if (!epgProgram) return 0;
        const total = epgProgram.stop - epgProgram.start;
        const elapsed = Date.now() - epgProgram.start;
        return Math.max(0, Math.min(100, (elapsed / total) * 100));
      }, [epgProgram]);

      return (
        <div
          className="player-root"
          ref={containerRef}
          onMouseMove={wakeOverlay}
          onTouchStart={wakeOverlay}
        >
          <div className="player-video-wrap">
            <video
              ref={videoRef}
              className="player-video"
              playsInline
              aria-label={`${channel.name} live video player`}
            />

            {(status === "loading" || status === "buffering") && (
              <div className="player-status"><div className="spinner" /></div>
            )}

            {status === "error" && (
              <div className="player-status">
                <div className="player-error">
                  <Icon.Warn style={{ color: "var(--danger)" }} />
                  <h3>Playback failed</h3>
                  <p>{friendlyError(errorInfo)}</p>
                  <button className="btn btn-accent" onClick={retry}><Icon.Refresh /> Reconnect</button>
                </div>
              </div>
            )}
          </div>

          <div className={classNames("player-overlay", idle && status === "playing" && "idle")}>
            <div className="overlay-top">
              <button className="ctrl-btn overlay-close" onClick={onClose} aria-label="Close player"><Icon.X /></button>
              <div className="overlay-channel-logo">
                {channel.logo ? <img src={channel.logo} alt="" /> : <Icon.Tv />}
              </div>
              <div className="overlay-channel-text">
                <div className="overlay-channel-name">{channel.name}</div>
                <div className="overlay-program">{epgProgram ? epgProgram.title : channel.group || "Live channel"}</div>
              </div>
              <div style={{ flex: 1 }} />
              <span className="overlay-live-pill"><span className="dot" />LIVE</span>
            </div>

            <div className="overlay-bottom">
              {epgProgram && (
                <div className="epg-progress">
                  <span>{timeLabel(epgProgram.start)}</span>
                  <div className="epg-progress-bar"><div className="epg-progress-fill" style={{ width: progressPct + "%" }} /></div>
                  <span>{timeLabel(epgProgram.stop)}</span>
                </div>
              )}
              <div className="controls-row">
                <button className="ctrl-btn" onClick={onPrev} aria-label="Previous channel"><Icon.Prev /></button>
                <button className="ctrl-btn primary" onClick={togglePlay} aria-label={playing ? "Pause" : "Play"}>
                  {playing ? <Icon.Pause /> : <Icon.Play />}
                </button>
                <button className="ctrl-btn" onClick={onNext} aria-label="Next channel"><Icon.Next /></button>

                <div className="volume-wrap">
                  <button className="ctrl-btn" onClick={() => setMuted(!muted)} aria-label={muted ? "Unmute" : "Mute"}>
                    {muted || volume === 0 ? <Icon.Mute /> : <Icon.Volume />}
                  </button>
                  <input
                    type="range" min="0" max="1" step="0.01"
                    value={muted ? 0 : volume}
                    onChange={(e) => { setVolume(parseFloat(e.target.value)); if (muted) setMuted(false); }}
                    aria-label="Volume"
                  />
                </div>

                <button
                  className={classNames("ctrl-btn", isFavorite && "is-fav")}
                  onClick={onToggleFavorite}
                  aria-label={isFavorite ? "Remove from favorites" : "Add to favorites"}
                  style={isFavorite ? { color: "var(--accent)" } : undefined}
                >
                  <Icon.Heart filled={isFavorite} />
                </button>

                <button className="ctrl-btn" onClick={onOpenEpg} aria-label="Program guide"><Icon.Info /></button>

                <div className="spacer" />

                {qualities.length > 0 && (
                  <div className="quality-menu-wrap">
                    <button className="ctrl-btn" onClick={() => setShowQualityMenu((s) => !s)} aria-label="Quality">
                      <Icon.List />
                    </button>
                    {showQualityMenu && (
                      <div className="dropdown-menu" role="menu">
                        <button className={classNames("dropdown-item", activeQuality === -1 && "active")} onClick={() => selectQuality(-1)}>Auto</button>
                        {qualities.map((q) => (
                          <button key={q.index} className={classNames("dropdown-item", activeQuality === q.index && "active")} onClick={() => selectQuality(q.index)}>
                            {q.height ? `${q.height}p` : `Level ${q.index + 1}`}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {document.pictureInPictureEnabled && (
                  <button className="ctrl-btn" onClick={togglePip} aria-label="Picture in picture"><Icon.Pip /></button>
                )}
                <button className="ctrl-btn" onClick={toggleFullscreen} aria-label="Fullscreen"><Icon.Fullscreen /></button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================== EPG modal ============================== */

    function EPG({ channel, programs, onClose }) {
      const now = Date.now();
      return (
        <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label={`Program guide for ${channel.name}`}>
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{channel.name} — Guide</h2>
              <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon.X /></button>
            </div>
            <div className="modal-body">
              {!channel.tvgId ? (
                <p className="settings-row-desc">This channel doesn't have a tvg-id, so we can't match it to EPG data.</p>
              ) : !programs.length ? (
                <p className="settings-row-desc">No program data available for this channel. Add an XMLTV EPG source in Settings, or the player will keep working normally without one.</p>
              ) : (
                <div className="epg-list">
                  {programs.slice(0, 40).map((p, i) => {
                    const isCurrent = now >= p.start && now < p.stop;
                    return (
                      <div key={i} className={classNames("epg-item", isCurrent && "current")}>
                        <div className="epg-time">{timeLabel(p.start)}–{timeLabel(p.stop)}</div>
                        <div>
                          <div className="epg-title">{p.title}{isCurrent && "  •  Now"}</div>
                          {p.desc && <div className="epg-desc">{p.desc}</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ============================== Playlist manager modal ============================== */

    function PlaylistManager({ playlists, onClose, onAddFile, onAddUrl, onAddDirect, onRefresh, onRemove }) {
      const [tab, setTab] = useState("file"); // file | url | direct
      const [name, setName] = useState("");
      const [url, setUrl] = useState("");
      const [busy, setBusy] = useState(false);
      const fileInputRef = useRef(null);

      async function handleFileChosen(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setBusy(true);
        try {
          const text = await file.text();
          onAddFile(name || file.name.replace(/\.[^.]+$/, ""), text);
          setName("");
        } finally {
          setBusy(false);
          e.target.value = "";
        }
      }

      async function handleUrlSubmit(e) {
        e.preventDefault();
        if (!url.trim()) return;
        setBusy(true);
        if (tab === "direct") {
          onAddDirect(name, url.trim());
        } else {
          await onAddUrl(name, url.trim());
        }
        setBusy(false);
        setUrl(""); setName("");
      }

      return (
        <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label="Manage playlists">
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Playlists</h2>
              <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon.X /></button>
            </div>
            <div className="modal-body">
              <div className="banner banner-info">
                WebTV only plays streams you provide. Make sure you have the legal right to access any playlist or stream you add.
              </div>

              <div>
                <span className="field-label">Add a new source</span>
                <div className="tab-row" role="tablist">
                  <button role="tab" aria-selected={tab === "file"} className={tab === "file" ? "active" : ""} onClick={() => setTab("file")}>M3U File</button>
                  <button role="tab" aria-selected={tab === "url"} className={tab === "url" ? "active" : ""} onClick={() => setTab("url")}>M3U URL</button>
                  <button role="tab" aria-selected={tab === "direct"} className={tab === "direct" ? "active" : ""} onClick={() => setTab("direct")}>Direct M3U8</button>
                </div>
              </div>

              <div>
                <label className="field-label" htmlFor="pl-name">Name (optional)</label>
                <input id="pl-name" className="text-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="My Playlist" />
              </div>

              {tab === "file" ? (
                <div>
                  <span className="field-label">Choose an .m3u / .m3u8 file</span>
                  <button className="file-input-btn" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={busy}>
                    {busy ? "Reading file…" : "Browse files…"}
                  </button>
                  <input ref={fileInputRef} type="file" accept=".m3u,.m3u8,text/plain" style={{ display: "none" }} onChange={handleFileChosen} />
                </div>
              ) : (
                <form onSubmit={handleUrlSubmit}>
                  <label className="field-label" htmlFor="pl-url">{tab === "url" ? "Playlist URL (.m3u / .m3u8)" : "Direct stream URL (.m3u8)"}</label>
                  <input
                    id="pl-url" className="text-input" value={url} onChange={(e) => setUrl(e.target.value)}
                    placeholder={tab === "url" ? "https://example.com/playlist.m3u8" : "https://example.com/stream.m3u8"}
                    inputMode="url"
                  />
                  <div style={{ height: 12 }} />
                  <button className="btn btn-accent" type="submit" disabled={busy || !url.trim()}>
                    {busy ? "Loading…" : "Add"}
                  </button>
                </form>
              )}

              <div>
                <span className="field-label">Your playlists ({playlists.length})</span>
                {!playlists.length ? (
                  <p className="settings-row-desc">No playlists added yet.</p>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {playlists.map((p) => (
                      <div className="playlist-row" key={p.id}>
                        <div className="playlist-row-info">
                          <div className="playlist-row-name">{p.name}</div>
                          <div className="playlist-row-meta">{p.channelCount} channels · {p.sourceType} · added {new Date(p.addedAt).toLocaleDateString()}</div>
                        </div>
                        <div className="playlist-row-actions">
                          <button className="btn-icon" onClick={() => onRefresh(p.id)} aria-label={`Refresh ${p.name}`}><Icon.Refresh /></button>
                          <button className="btn-icon btn-danger" onClick={() => onRemove(p.id)} aria-label={`Remove ${p.name}`}><Icon.Trash /></button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================== Settings modal ============================== */

    function Settings({ uiPrefs, setUiPrefs, epgSource, setEpgSource, epgStatus, onClose, onClearData }) {
      const [epgUrl, setEpgUrl] = useState((epgSource && epgSource.type === "url" && epgSource.value) || "");
      const fileInputRef = useRef(null);

      function toggle(key) {
        setUiPrefs((p) => ({ ...p, [key]: !p[key] }));
      }

      function applyEpgUrl(e) {
        e.preventDefault();
        if (!epgUrl.trim()) { setEpgSource(null); return; }
        setEpgSource({ type: "url", value: epgUrl.trim() });
      }

      async function handleEpgFile(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const text = await file.text();
        setEpgSource({ type: "text", value: text });
        e.target.value = "";
      }

      return (
        <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label="Settings">
          <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Settings</h2>
              <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon.X /></button>
            </div>
            <div className="modal-body">
              <div>
                <span className="field-label">Playback</span>
                <div className="settings-row">
                  <div>
                    <div className="settings-row-label">Autoplay channels</div>
                    <div className="settings-row-desc">Start playing automatically when you select a channel.</div>
                  </div>
                  <button className={classNames("toggle", uiPrefs.autoplay && "on")} onClick={() => toggle("autoplay")} role="switch" aria-checked={uiPrefs.autoplay} aria-label="Autoplay channels">
                    <span className="toggle-knob" />
                  </button>
                </div>
                <div className="settings-row">
                  <div>
                    <div className="settings-row-label">Remember last channel</div>
                    <div className="settings-row-desc">Keep track of the last channel you watched.</div>
                  </div>
                  <button className={classNames("toggle", uiPrefs.rememberLast && "on")} onClick={() => toggle("rememberLast")} role="switch" aria-checked={uiPrefs.rememberLast} aria-label="Remember last channel">
                    <span className="toggle-knob" />
                  </button>
                </div>
                <div className="settings-row">
                  <div>
                    <div className="settings-row-label">Reduce animations</div>
                    <div className="settings-row-desc">Minimize motion across the interface.</div>
                  </div>
                  <button className={classNames("toggle", uiPrefs.reduceAnimations && "on")} onClick={() => toggle("reduceAnimations")} role="switch" aria-checked={uiPrefs.reduceAnimations} aria-label="Reduce animations">
                    <span className="toggle-knob" />
                  </button>
                </div>
              </div>

              <div>
                <span className="field-label">EPG (optional XMLTV guide)</span>
                <form onSubmit={applyEpgUrl} style={{ display: "flex", gap: 8 }}>
                  <input className="text-input" value={epgUrl} onChange={(e) => setEpgUrl(e.target.value)} placeholder="https://example.com/guide.xml" />
                  <button className="btn" type="submit">Set</button>
                </form>
                <div style={{ height: 8 }} />
                <button className="file-input-btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Or upload an XMLTV file…</button>
                <input ref={fileInputRef} type="file" accept=".xml,.xmltv,text/xml" style={{ display: "none" }} onChange={handleEpgFile} />
                <p className="settings-row-desc" style={{ marginTop: 8 }}>
                  Status: {epgStatus === "ready" ? "Loaded" : epgStatus === "loading" ? "Loading…" : epgStatus === "error" ? "Failed to load" : "No EPG source set"}. Playback works normally without one.
                </p>
              </div>

              <div>
                <span className="field-label">Data</span>
                <p className="settings-row-desc">Favorites, recently watched, and saved playlists are stored only in this browser's local storage — never uploaded anywhere.</p>
                <button className="btn btn-danger" onClick={() => { if (confirm("Clear all WebTV data from this browser? This cannot be undone.")) onClearData(); }}>
                  <Icon.Trash /> Clear all local data
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ============================== Mount ============================== */

    const rootEl = document.getElementById("root");
    ReactDOM.createRoot(rootEl).render(<App />);

  </script>
</body>

</html>
